<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미친 제자들</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            background-color: #1a1a1a;
        }
        #chatContainer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 350px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #4ECDC4;
            border-radius: 5px;
            overflow: hidden;
        }
        #chatMessages {
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
        }
        .chatMessage {
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .chatMessage .playerName {
            color: #4ECDC4;
            font-weight: 600;
        }
        .chatMessage .messageText {
            color: #ffffff;
        }
        #chatInputContainer {
            display: flex;
            padding: 5px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid #4ECDC4;
        }
        #chatInput {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4ECDC4;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        #chatInput::placeholder {
            color: #888;
        }
        #chatInput:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Lobby UI */
        #lobbyContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(20px, 5vh, 60px) 20px;
            box-sizing: border-box;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        #lobbyContainer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .lobby-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            width: 100%;
            max-width: 800px;
        }
        .lobby-title {
            font-family: 'Jua', sans-serif;
            font-size: clamp(36px, 8vw, 72px);
            color: #00D9FF;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5), 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: clamp(5px, 1vh, 10px);
            text-align: center;
        }
        .lobby-subtitle {
            font-family: 'Jua', sans-serif;
            font-size: clamp(18px, 4vw, 28px);
            color: #A78BFA;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: clamp(20px, 4vh, 50px);
        }
        .character-select {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: clamp(15px, 3vh, 30px);
        }
        .character-select-label {
            font-family: 'Jua', sans-serif;
            font-size: clamp(18px, 3vw, 24px);
            color: #E0E0E0;
            margin-bottom: clamp(8px, 1.5vh, 15px);
        }
        .character-list {
            display: flex;
            gap: clamp(10px, 2vw, 20px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .character-option {
            width: clamp(80px, 15vw, 120px);
            height: clamp(100px, 18vw, 140px);
            border: 3px solid #4ECDC4;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(5px, 1vw, 10px);
        }
        .character-option:hover {
            transform: scale(1.05);
            border-color: #00D9FF;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        .character-option.selected {
            border-color: #FFD700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.1);
        }
        .character-option img {
            width: clamp(50px, 10vw, 80px);
            height: clamp(50px, 10vw, 80px);
            object-fit: contain;
        }
        .character-name {
            font-family: 'Jua', sans-serif;
            font-size: clamp(14px, 2vw, 18px);
            color: #ffffff;
            margin-top: clamp(4px, 0.5vh, 8px);
        }
        .character-info {
            margin-top: clamp(8px, 1.5vh, 15px);
            text-align: center;
        }
        .character-stats {
            font-family: 'Jua', sans-serif;
            font-size: clamp(12px, 2vw, 16px);
            color: #4ECDC4;
            margin-bottom: clamp(4px, 0.5vh, 8px);
        }
        .character-skills {
            font-family: 'Jua', sans-serif;
            font-size: clamp(11px, 1.8vw, 14px);
            color: #A78BFA;
        }
        .name-input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: clamp(20px, 4vh, 40px);
            width: 100%;
        }
        .name-input-label {
            font-family: 'Jua', sans-serif;
            font-size: clamp(18px, 3vw, 24px);
            color: #E0E0E0;
            margin-bottom: clamp(8px, 1.5vh, 15px);
        }
        #playerNameInput {
            width: min(280px, 80vw);
            padding: clamp(10px, 2vh, 15px) clamp(15px, 3vw, 20px);
            font-family: 'Jua', sans-serif;
            font-size: clamp(18px, 3vw, 22px);
            border: 3px solid #4ECDC4;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        #playerNameInput::placeholder {
            color: #888;
        }
        #playerNameInput:focus {
            border-color: #00D9FF;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }
        #startGameBtn {
            font-family: 'Jua', sans-serif;
            font-size: clamp(20px, 4vw, 28px);
            padding: clamp(12px, 2vh, 18px) clamp(40px, 8vw, 60px);
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #4ECDC4 0%, #00D9FF 100%);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }
        #startGameBtn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 217, 255, 0.5);
        }
        #startGameBtn:active:not(:disabled) {
            transform: translateY(0);
        }
        #startGameBtn:disabled {
            background: linear-gradient(135deg, #666 0%, #888 100%);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Reconnect Dialog */
        #reconnectOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #reconnectOverlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .reconnect-dialog {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #FF6B6B;
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.3);
        }
        .reconnect-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .reconnect-title {
            font-family: 'Jua', sans-serif;
            font-size: 24px;
            color: #FF6B6B;
            margin-bottom: 10px;
        }
        .reconnect-status {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #E0E0E0;
            margin-bottom: 20px;
            min-height: 24px;
        }
        .reconnect-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .reconnect-btn {
            font-family: 'Jua', sans-serif;
            font-size: 18px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reconnect-btn.primary {
            background: linear-gradient(135deg, #4ECDC4 0%, #00D9FF 100%);
            color: #1a1a2e;
        }
        .reconnect-btn.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
        }
        .reconnect-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #E0E0E0;
            border: 2px solid #4ECDC4;
        }
        .reconnect-btn.secondary:hover:not(:disabled) {
            background: rgba(78, 205, 196, 0.2);
        }
        .reconnect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .reconnect-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A78BFA;
        }
        .reconnect-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .reconnect-countdown {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

        /* Small screen adjustments */
        @media (max-height: 600px) {
            #lobbyContainer {
                padding: 15px;
            }
            .lobby-subtitle {
                margin-bottom: 15px;
            }
            .character-select {
                margin-bottom: 10px;
            }
            .character-info {
                margin-top: 5px;
            }
            .name-input-section {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Reconnect Dialog -->
    <div id="reconnectOverlay">
        <div class="reconnect-dialog">
            <div class="reconnect-icon">🔌</div>
            <div class="reconnect-title">서버 연결 끊김</div>
            <div id="reconnectStatus" class="reconnect-status">서버와의 연결이 끊어졌습니다.</div>
            <div class="reconnect-options">
                <button id="reconnectBtn" class="reconnect-btn primary">🔄 재연결 시도</button>
                <button id="reloadBtn" class="reconnect-btn secondary">🔃 페이지 새로고침</button>
            </div>
            <div class="reconnect-toggle">
                <input type="checkbox" id="autoReconnectToggle" checked>
                <label for="autoReconnectToggle">자동 재연결 시도</label>
            </div>
            <div id="reconnectCountdown" class="reconnect-countdown"></div>
        </div>
    </div>

    <!-- Lobby UI -->
    <div id="lobbyContainer">
        <div class="lobby-content">
            <div class="lobby-title">미친 제자들</div>
            <div class="lobby-subtitle">Unhinged Students</div>

            <div class="character-select">
                <div class="character-select-label">캐릭터 선택</div>
                <div class="character-list">
                    <div class="character-option selected" data-character="alien">
                        <img src="asset/image/alien.png" alt="외계인">
                        <div class="character-name">외계인</div>
                    </div>
                    <div class="character-option" data-character="crazy-eyes">
                        <img src="asset/image/crazy-eyes.png" alt="눈 돌아가는 사람">
                        <div class="character-name">눈 돌아가는 사람</div>
                    </div>
                    <div class="character-option" data-character="curry-bear">
                        <img src="asset/image/curry-bear.png" alt="카레 곰돌이">
                        <div class="character-name">카레 곰돌이</div>
                    </div>
                    <div class="character-option" data-character="big-sis-hulk">
                        <img src="asset/image/big-sis-hulk.png" alt="헐크 언니">
                        <div class="character-name">헐크 언니</div>
                    </div>
                    <div class="character-option" data-character="teacher">
                        <img src="asset/image/teacher.png" alt="선생님">
                        <div class="character-name">선생님</div>
                    </div>
                    <div class="character-option" data-character="squeak-squeak">
                        <img src="asset/image/squeak-squeak.png" alt="찍찍찍찍찍">
                        <div class="character-name">찍찍찍찍찍</div>
                    </div>
                </div>
                <div class="character-info">
                    <div class="character-stats">❤️ 체력: 보통 | ⚡ 속도: 빠름</div>
                    <div class="character-skills">✨ 순간이동 | 🧠 텔레파시 | 👁️ 초능력</div>
                </div>
            </div>

            <div class="name-input-section">
                <div class="name-input-label">플레이어 이름</div>
                <input type="text" id="playerNameInput" placeholder="이름을 입력하세요" maxlength="12">
            </div>

            <button id="startGameBtn" disabled>게임 시작</button>
        </div>
    </div>

    <!-- Chat UI -->
    <div id="chatContainer">
        <div id="chatMessages"></div>
        <div id="chatInputContainer">
            <input type="text" id="chatInput" placeholder="Press Enter to chat..." maxlength="100">
        </div>
    </div>

    <!-- Socket.io client -->
    <script src="/game/socket.io/socket.io.js"></script>
    <!-- Game scripts - Core modules (must be loaded first) -->
    <script src="src/utils/logger.js"></script>
    <script src="src/config.js"></script>
    <script src="src/core/gameState.js"></script>
    <!-- UI and combat utilities -->
    <script src="src/rendering/uiRenderer.js"></script>
    <script src="src/combat/enemyFinder.js"></script>
    <!-- Game components -->
    <script src="src/lobby.js"></script>
    <script src="src/input.js"></script>
    <script src="src/characterUtils.js"></script>
    <script src="src/character.js"></script>
    <script src="src/shard.js"></script>
    <script src="src/skill.js"></script>
    <!-- Network module (split into multiple files) -->
    <script src="src/network/effects/laser.js"></script>
    <script src="src/network/effects/teleport.js"></script>
    <script src="src/network/effects/wave.js"></script>
    <script src="src/network/effects/potSmash.js"></script>
    <script src="src/network/effects/curryRecovery.js"></script>
    <script src="src/network/effects/spinThrow.js"></script>
    <script src="src/network/effects/rage.js"></script>
    <script src="src/network/ReconnectUI.js"></script>
    <script src="src/network/RemotePlayer.js"></script>
    <script src="src/network/NetworkManager.js"></script>
    <script src="src/network/index.js"></script>
    <script src="src/chat.js"></script>
    <!-- Main game entry point (must be loaded last) -->
    <script src="src/game.js"></script>
</body>
</html>
